services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wms-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - wms
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: wms
      DB_USERNAME: wms
      DB_PASSWORD: secret
      REDIS_HOST: redis

  nginx:
    image: nginx:1.27-alpine
    container_name: wms-nginx
    ports:
      - "${WMS_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wms

  mysql:
    image: mysql:8.0
    container_name: wms-mysql
    restart: unless-stopped
    ports:
      - "${WMS_MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: wms
      MYSQL_USER: wms
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - wms_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wms

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    ports:
      - "${WMS_REDIS_PORT:-6380}:6379"
    networks:
      - wms

  mailpit:
    image: axllent/mailpit:latest
    container_name: wms-mailpit
    ports:
      - "${WMS_MAILPIT_UI_PORT:-8025}:8025"
      - "${WMS_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - wms

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wms-horizon
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - wms

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wms-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "${WMS_REVERB_PORT:-8081}:8081"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - wms

networks:
  wms:
    driver: bridge

volumes:
  wms_mysql:
